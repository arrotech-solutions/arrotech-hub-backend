# =============================================================================
# CI/CD Pipeline for Mini-Hub (Python Backend)
# =============================================================================
# Uses centralized reusable workflows from arrotech-solutions-actions
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant permissions required by reusable workflows
permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===========================================================================
  # Stage 1: Code Quality & Security
  # ===========================================================================

  code-quality:
    name: Code Quality
    uses: arrotech-solutions/arrotech-solutions-actions/.github/workflows/ci-code-quality.yml@main
    with:
      language: "python"
      python-version: "3.11"
      fail-on-warnings: false

  security-scan:
    name: Security Scan
    uses: arrotech-solutions/arrotech-solutions-actions/.github/workflows/ci-security-scan.yml@main
    with:
      language: "python"
      enable-codeql: false        # Requires GitHub Advanced Security (paid)
      enable-dependency-scan: true
      enable-secret-scan: false   # Gitleaks requires license for orgs
      fail-on-high-severity: false

  # ===========================================================================
  # Stage 1.5: Architecture Verification (Harness Gates)
  # ===========================================================================

  architecture-check:
    name: Architecture Verification
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Architecture
        run: python scripts/verify_architecture.py
      - name: Verify Imports
        run: python scripts/verify_imports.py
      - name: Verify Tool Consistency
        run: python scripts/verify_tools.py

  # ===========================================================================
  # Stage 2: Testing
  # ===========================================================================

  test:
    name: Tests
    needs: [architecture-check]
    uses: arrotech-solutions/arrotech-solutions-actions/.github/workflows/ci-test.yml@main
    with:
      language: "python"
      python-version: "3.11"
      coverage-threshold: 20  # TODO: Increase as tests are added
      upload-coverage: true
      parallel-tests: true

  # ===========================================================================
  # Stage 2.5: Change Impact Analysis (PR only)
  # ===========================================================================

  impact-analysis:
    name: Change Impact Analysis
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyze Change Impact
        id: impact
        run: |
          python scripts/analyze_impact.py --diff origin/${{ github.base_ref }} --output markdown > impact_report.md
          cat impact_report.md
      - name: Post Impact Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = fs.readFileSync('impact_report.md', 'utf8');
              if (report.trim()) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: report
                });
              }
            } catch (e) {
              console.log('No impact report to post');
            }


  # ===========================================================================
  # Stage 3: Deploy to AWS EC2 through Systems Manager
  # ===========================================================================
  # Production deploy uses GitHub OIDC and SSM; no inbound SSH is required.
  # Configure the production environment with:
  #   Secret: AWS_DEPLOY_ROLE_ARN
  #   Variables: AWS_REGION, EC2_INSTANCE_ID
  # ===========================================================================

  deploy-production:
    name: Deploy to Production (EC2)
    needs: [security-scan, architecture-check, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::Set EC2_INSTANCE_ID in the production environment."
            exit 1
          fi

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -eu
          sudo -u ubuntu -H bash <<'DEPLOY_AS_UBUNTU'
          set -euo pipefail
          cd /home/ubuntu/arrotech-hub-backend

          PREVIOUS_COMMIT=$(git rev-parse HEAD)
          echo "Previous commit: $PREVIOUS_COMMIT"

          git fetch origin main
          git reset --hard origin/main
          NEW_COMMIT=$(git rev-parse HEAD)
          echo "Deploying commit: $NEW_COMMIT"

          COMPOSE=(docker compose --env-file .env.production -f docker-compose.prod.yml)
          "${COMPOSE[@]}" build app celery-worker
          "${COMPOSE[@]}" up -d --force-recreate app celery-worker celery-beat nginx

          echo "Waiting for application health..."
          ELAPSED=0
          while [ "$ELAPSED" -lt 90 ]; do
            if "${COMPOSE[@]}" exec -T app curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "App health check passed after ${ELAPSED}s"
              break
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ "$ELAPSED" -ge 90 ]; then
            echo "App health check failed. Recent app logs:"
            "${COMPOSE[@]}" logs app --tail 80 || true
            echo "Rolling back to $PREVIOUS_COMMIT"
            git reset --hard "$PREVIOUS_COMMIT"
            "${COMPOSE[@]}" up -d --build --force-recreate app celery-worker celery-beat nginx
            exit 1
          fi

          if ! curl -sf -k https://prod.api.arrotechsolutions.com/health > /dev/null 2>&1; then
            echo "External health check failed. Recent nginx logs:"
            "${COMPOSE[@]}" logs nginx --tail 40 || true
            echo "Rolling back to $PREVIOUS_COMMIT"
            git reset --hard "$PREVIOUS_COMMIT"
            "${COMPOSE[@]}" up -d --build --force-recreate app celery-worker celery-beat nginx
            exit 1
          fi

          echo "Production deployment successful!"
          docker image prune -f --filter "until=72h" 2>/dev/null || true
          DEPLOY_AS_UBUNTU
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg commands "$DEPLOY_SCRIPT" '{commands: [$commands]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA} from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command: $COMMAND_ID"

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent}' \
                  --output json
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated|DeliveryTimedOut|ExecutionTimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,ExitCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                echo "::error::SSM deployment command ended with status $STATUS."
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "::error::Timed out waiting for the SSM deployment command."
          exit 1

  # ===========================================================================
  # Post-Deployment Health Check
  # ===========================================================================

  health-check:
    name: Health Check
    needs: [deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 15

      - name: Check production health
        if: needs.deploy-production.result == 'success'
        run: |
          echo "Checking production health..."
          for i in 1 2 3; do
            if curl -sf "${{ secrets.PROD_API_URL }}/health"; then
              echo ""
              echo "Production is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Production health check failed after 3 attempts"
          exit 1

  # ===========================================================================
  # PR Checks
  # ===========================================================================

  pr-checks:
    name: PR Validation
    if: github.event_name == 'pull_request'
    uses: arrotech-solutions/arrotech-solutions-actions/.github/workflows/pr-checks.yml@main
    with:
      require-conventional-commits: true
      require-tests: true
